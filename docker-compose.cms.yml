# Optional development overlay. Production CMS routing/deployment is task 078.
# docker compose -f docker-compose.yml -f docker-compose.cms.yml up --build cms
x-cms-environment: &cms-environment
  CMS_ENV: development
  CMS_PUBLIC_URL: http://localhost:3002
  CMS_DATABASE_HOST: postgres
  CMS_DATABASE_PORT: "5432"
  CMS_DATABASE_PASSWORD: ${CMS_DATABASE_PASSWORD:-}
  CMS_SECRET: ${CMS_SECRET:-}
  CMS_FRONTEND_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
  CMS_PREVIEW_SECRET: ${CMS_PREVIEW_SECRET:-}
  CMS_REVALIDATE_SECRET: ${CMS_REVALIDATE_SECRET:-}
  CMS_REVALIDATE_URL: http://frontend:3000/api/blog/revalidate
  CMS_MARKETPLACE_API_URL: http://backend:8000/api/v1
  CMS_SMTP_HOST: mailpit
  CMS_SMTP_PORT: "1025"
  CMS_S3_ENDPOINT: http://minio:9000
  CMS_S3_REGION: us-east-1
  CMS_S3_BUCKET: svezapecanje-cms
  CMS_S3_FORCE_PATH_STYLE: "true"
  CMS_S3_PUBLIC_URL: ${CMS_S3_PUBLIC_URL:-http://localhost:9000/svezapecanje-cms}
  CMS_S3_ACCESS_KEY_ID: ${CMS_S3_ACCESS_KEY_ID:-szp-cms}
  CMS_S3_SECRET_ACCESS_KEY: ${CMS_S3_SECRET_ACCESS_KEY:-}

services:
  cms-storage-provision:
    build:
      context: ./cms
      target: tools
    environment:
      <<: *cms-environment
      CMS_MINIO_ROOT_USER: minioadmin
      CMS_MINIO_ROOT_PASSWORD: minioadmin
    depends_on:
      minio:
        condition: service_started
    command: ["pnpm", "storage:provision"]
    restart: "no"

  frontend:
    environment:
      BLOG_ANALYTICS_ENABLED: ${BLOG_ANALYTICS_ENABLED:-false}
      BLOG_ANALYTICS_EXCLUDED_POST_IDS: ${BLOG_ANALYTICS_EXCLUDED_POST_IDS:-}
      CMS_INTERNAL_URL: http://cms:3002
      CMS_PREVIEW_SECRET: ${CMS_PREVIEW_SECRET:-}
      CMS_REVALIDATE_SECRET: ${CMS_REVALIDATE_SECRET:-}
      CMS_S3_PUBLIC_URL: ${CMS_S3_PUBLIC_URL:-http://localhost:9000/svezapecanje-cms}

  cms-provision:
    build:
      context: ./cms
      target: tools
    environment:
      <<: *cms-environment
      CMS_PROVISION_USER: ${POSTGRES_USER:-postgres}
      CMS_PROVISION_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "db:provision"]
    restart: "no"

  cms-migrate:
    build:
      context: ./cms
      target: tools
    environment: *cms-environment
    depends_on:
      cms-provision:
        condition: service_completed_successfully
    command: ["pnpm", "migrate"]
    restart: "no"

  cms:
    build:
      context: ./cms
      target: tools
    environment: *cms-environment
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - ./cms:/app
      - cms_node_modules:/app/node_modules
      - cms_next:/app/.next
    depends_on:
      cms-migrate:
        condition: service_completed_successfully
      cms-storage-provision:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    command: ["sh", "-c", "CI=true pnpm install --frozen-lockfile && pnpm dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  cms_node_modules:
  cms_next:
