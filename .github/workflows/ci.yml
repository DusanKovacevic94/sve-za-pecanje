name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check
      - run: uv run python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=60
      - name: SQLite migration smoke check (non-authoritative)
        run: |
          DB=/tmp/szp-ci-alembic.db
          rm -f "$DB"
          DATABASE_URL=sqlite:///$DB uv run python -m alembic upgrade head
          DATABASE_URL=sqlite:///$DB uv run python -m alembic check

  postgres-release-gate:
    name: PostgreSQL migration release gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_GATE_BOOTSTRAP_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
        working-directory: backend
      - name: Run restricted-role upgrade, drift, downgrade, and privilege checks
        run: make migration-gate-postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - run: uv sync --extra dev
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Run Playwright release gate three times without retries
        run: pnpm test:e2e --repeat-each=3
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  production-images:
    runs-on: ubuntu-latest
    needs: [backend, postgres-release-gate, frontend]
    env:
      APP_ENV_FILE: .env.production.example
    steps:
      - uses: actions/checkout@v4
      - name: Validate merged production configuration
        run: python3 ops/validate_production_compose.py
      - name: Build production images
        run: |
          docker compose --env-file .env.production.example \
            -f docker-compose.yml -f docker-compose.prod.yml \
            build backend frontend
      - name: Smoke test frontend runner image
        run: |
          docker compose --env-file .env.production.example \
            -f docker-compose.yml -f docker-compose.prod.yml \
            run --rm --no-deps frontend \
            sh -c 'test -f server.js && test "$(id -un)" = nextjs'
