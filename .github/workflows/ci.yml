name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check
      - run: uv run python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=60
      - name: SQLite migration smoke check (non-authoritative)
        run: |
          DB=/tmp/szp-ci-alembic.db
          rm -f "$DB"
          DATABASE_URL=sqlite:///$DB uv run python -m alembic upgrade head
          DATABASE_URL=sqlite:///$DB uv run python -m alembic check

  postgres-release-gate:
    name: PostgreSQL migration release gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_GATE_BOOTSTRAP_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
        working-directory: backend
      - name: Run restricted-role upgrade, drift, downgrade, and privilege checks
        run: make migration-gate-postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.4"
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --extra dev
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Reject canonical brand asset drift
        run: make brand-release-check
        working-directory: .
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Run Playwright release gate three times without retries
        run: pnpm test:e2e:release
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload brand visual baselines and run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brand-visual-evidence
          path: |
            frontend/e2e/brand-visual.spec.ts-snapshots
            frontend/test-results/marketplace/brand-visual-*
          if-no-files-found: ignore
          retention-days: 14

  cms-release-gate:
    name: CMS editorial and recovery release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOG_ANALYTICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - name: Install each application's pinned package manager and dependencies
        run: |
          corepack enable
          cd cms && pnpm install --frozen-lockfile
          cd ../frontend && pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: CMS lint, types, units and standalone build
        run: make cms-check
      - name: Public blog parser and analytics policy units
        run: node frontend/scripts/test-blog.mjs
      - name: Isolated PostgreSQL, MinIO, email, editor browser and publishing journey
        run: make cms-test-integration
      - name: Production configuration, images, TLS and database/media recovery
        run: make cms-production-rehearsal
      - name: Upload synthetic blog review and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blog-release-evidence
          path: |
            frontend/test-results/blog
            frontend/test-results/blog-editor
          if-no-files-found: ignore
          retention-days: 14

  production-images:
    runs-on: ubuntu-latest
    needs: [backend, postgres-release-gate, frontend, cms-release-gate]
    env:
      APP_ENV_FILE: .env.production.example
    steps:
      - uses: actions/checkout@v6
      - name: Validate merged production configuration
        run: python3 ops/validate_production_compose.py
      - name: Build production images
        run: |
          docker compose --env-file .env.production.example \
            -f docker-compose.yml -f docker-compose.prod.yml \
            build backend frontend
      - name: Smoke test frontend runner image
        run: |
          docker compose --env-file .env.production.example \
            -f docker-compose.yml -f docker-compose.prod.yml \
            run --rm --no-deps frontend \
            sh -c 'test -f server.js && test "$(id -un)" = nextjs'
