services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    expose:
      - "3000"

  backend:
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 3 -b 0.0.0.0:8000
    restart: unless-stopped
    environment:
      SMTP_HOST: ""
    ports: !reset []
    volumes: !reset []
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${APP_DOMAIN}/api/v1}
        NEXT_PUBLIC_ANALYTICS_URL: ${NEXT_PUBLIC_ANALYTICS_URL:-}
        NEXT_PUBLIC_ANALYTICS_WEBSITE_ID: ${NEXT_PUBLIC_ANALYTICS_WEBSITE_ID:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${APP_DOMAIN}/api/v1}
      NEXT_PUBLIC_ANALYTICS_URL: ${NEXT_PUBLIC_ANALYTICS_URL:-}
      NEXT_PUBLIC_ANALYTICS_WEBSITE_ID: ${NEXT_PUBLIC_ANALYTICS_WEBSITE_ID:-}
      INTERNAL_API_URL: http://backend:8000/api/v1
    command: node server.js
    restart: unless-stopped
    ports: !reset []
    volumes: !reset []
    expose:
      - "3000"

  postgres:
    restart: unless-stopped
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  minio: !reset null

  mailpit: !reset null

  worker:
    environment:
      SMTP_HOST: ""
    volumes: !reset []

  backup:
    image: postgres:16-alpine
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_ROOT: /backups
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      SMTP_HOST: ""
    volumes:
      - ./backend/scripts/backup_db.sh:/scripts/backup_db.sh:ro
      - postgres_backups:/backups
    entrypoint: /bin/sh
    command: -c "apk add --no-cache rclone >/dev/null && while true; do sh /scripts/backup_db.sh; sleep $${BACKUP_INTERVAL_SECONDS}; done"

volumes:
  caddy_data:
  caddy_config:
  postgres_backups:
